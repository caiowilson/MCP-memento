name: Move Server Latest

on:
  push:
    tags:
      - "server/v*"
  workflow_dispatch:
    inputs:
      server_tag:
        description: Server release tag to mirror to server/latest
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: server-latest
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Resolve source tag and version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ github.event.inputs.server_tag }}
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_TAG="$PUSH_TAG"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SOURCE_TAG="$DISPATCH_TAG"
          fi

          case "$SOURCE_TAG" in
            server/v*) ;;
            *)
              echo "expected a server/v* tag, got: $SOURCE_TAG" >&2
              exit 1
              ;;
          esac

          echo "server_tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${SOURCE_TAG#server/v}" >> "$GITHUB_OUTPUT"

      - name: Checkout versioned release commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.meta.outputs.server_tag }}

      - name: Wait for and download exact versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ steps.meta.outputs.server_tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          expected_assets() {
            printf '%s\n' \
              memento-mcp_darwin_x64 \
              memento-mcp_darwin_x64.sha256 \
              memento-mcp_darwin_arm64 \
              memento-mcp_darwin_arm64.sha256 \
              memento-mcp_linux_x64 \
              memento-mcp_linux_x64.sha256 \
              memento-mcp_linux_arm64 \
              memento-mcp_linux_arm64.sha256 \
              memento-mcp_windows_x64.exe \
              memento-mcp_windows_x64.exe.sha256 \
              memento-mcp_windows_arm64.exe \
              memento-mcp_windows_arm64.exe.sha256 \
              "memento-mcp_${VERSION}_linux_amd64.deb" \
              "memento-mcp_${VERSION}_linux_arm64.deb" \
              "memento-mcp_${VERSION}_darwin_amd64.pkg" \
              "memento-mcp_${VERSION}_darwin_arm64.pkg" \
              | sort
          }

          expected=$(expected_assets)
          ready=0
          for attempt in $(seq 1 120); do
            actual=$(gh release view "$SOURCE_TAG" --json assets \
              --jq '.assets[].name' 2>/dev/null | sort || true)
            if [ "$actual" = "$expected" ]; then
              ready=1
              break
            fi
            echo "Waiting for exact 16-asset release manifest ($attempt/120)"
            sleep 15
          done
          if [ "$ready" -ne 1 ]; then
            echo "versioned release did not publish the expected asset manifest" >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi

          mkdir -p dist
          gh release download "$SOURCE_TAG" --dir dist

          downloaded=$(find dist -maxdepth 1 -type f -exec basename {} \; | sort)
          if [ "$downloaded" != "$expected" ]; then
            echo "downloaded asset manifest differs from the release manifest" >&2
            printf 'Expected:\n%s\nDownloaded:\n%s\n' "$expected" "$downloaded" >&2
            exit 1
          fi

          (
            cd dist
            for checksum in *.sha256; do
              sha256sum -c "$checksum"
            done
          )

      - name: Update server/latest tag
        id: latest_tag
        env:
          SOURCE_TAG: ${{ steps.meta.outputs.server_tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG_SHA=$(git rev-list -n 1 "$SOURCE_TAG")
          if [ -z "$TAG_SHA" ]; then
            echo "could not resolve commit for $SOURCE_TAG" >&2
            exit 1
          fi
          git tag -f server/latest "$TAG_SHA"
          git push -f origin refs/tags/server/latest
          echo "tag_sha=$TAG_SHA" >> "$GITHUB_OUTPUT"

      - name: Replace server/latest with the verified asset mirror
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ steps.meta.outputs.server_tag }}
          TAG_SHA: ${{ steps.latest_tag.outputs.tag_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view server/latest >/dev/null 2>&1; then
            gh release delete server/latest --yes
          fi
          gh release create server/latest dist/* \
            --target "$TAG_SHA" \
            --title server/latest \
            --notes "Exact verified asset mirror of ${SOURCE_TAG}." \
            --prerelease
